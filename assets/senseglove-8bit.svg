<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Animação pixel art 8-bit mostrando LUVA com mini protoboard e sensor MPU-6050 conectados ao ARDUINO UNO por fios com dados em movimento" width="100%">
  <style>
    .px { shape-rendering: crispEdges; }
    .blink-fast { animation: blink 0.9s steps(1, end) infinite; }
    .blink-slow { animation: blink 1.6s steps(1, end) infinite; }
    .pulse { animation: pulse 1.4s ease-in-out infinite; transform-origin: center; }
    .packet { animation: dataFlow 2.2s linear infinite; }
    .glove-shift { animation: gloveShift 2.8s ease-in-out infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }

    @keyframes dataFlow {
      0% { transform: translateX(0); opacity: 0.2; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(170px); opacity: 0.2; }
    }

    @keyframes gloveShift {
      0%, 100% { transform: translateY(0); filter: brightness(1); }
      50% { transform: translateY(-2px); filter: brightness(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .blink-fast, .blink-slow, .pulse, .packet, .glove-shift {
        animation: none !important;
      }
    }
  </style>

  <rect class="px" width="720" height="240" fill="#0c1020" />
  <rect class="px" x="10" y="10" width="700" height="220" fill="#121a2f" stroke="#32416b" stroke-width="4" />

  <g class="px" font-family="monospace" font-size="20" fill="#d6e2ff" font-weight="700">
    <text x="75" y="42">LUVA</text>
    <text x="288" y="42">MPU-6050</text>
    <text x="510" y="42">ARDUINO UNO</text>
  </g>

  <g class="px">
    <rect x="40" y="62" width="180" height="150" fill="#1a2544" stroke="#3a4a79" stroke-width="2" />
    <rect x="260" y="62" width="180" height="150" fill="#1a2544" stroke="#3a4a79" stroke-width="2" />
    <rect x="480" y="62" width="180" height="150" fill="#1a2544" stroke="#3a4a79" stroke-width="2" />
  </g>

  <g class="px glove-shift" transform="translate(0 0)">
    <rect x="64" y="138" width="95" height="44" fill="#d9a07f" stroke="#613c2d" stroke-width="2" />
    <rect x="159" y="130" width="22" height="20" fill="#d9a07f" stroke="#613c2d" stroke-width="2" />
    <rect x="178" y="118" width="18" height="20" fill="#d9a07f" stroke="#613c2d" stroke-width="2" />
    <rect x="194" y="106" width="18" height="20" fill="#d9a07f" stroke="#613c2d" stroke-width="2" />
    <rect x="208" y="96" width="16" height="20" fill="#d9a07f" stroke="#613c2d" stroke-width="2" />

    <rect x="98" y="108" width="56" height="30" fill="#e8e5c8" stroke="#58513d" stroke-width="2" />
    <rect x="104" y="114" width="8" height="8" fill="#6f6f6f" />
    <rect x="118" y="114" width="8" height="8" fill="#6f6f6f" />
    <rect x="132" y="114" width="8" height="8" fill="#6f6f6f" />
    <rect x="146" y="114" width="8" height="8" fill="#6f6f6f" />
    <rect x="112" y="126" width="8" height="8" fill="#2cd9ff" class="blink-fast" />
    <rect x="126" y="126" width="8" height="8" fill="#7eff5f" class="blink-slow" />

    <line x1="154" y1="124" x2="264" y2="124" stroke="#00d1ff" stroke-width="4" />
    <line x1="154" y1="132" x2="264" y2="132" stroke="#ff6a6a" stroke-width="4" />
  </g>

  <g class="px">
    <rect x="310" y="104" width="72" height="46" fill="#2fbf71" stroke="#145537" stroke-width="2" />
    <rect x="318" y="112" width="10" height="10" fill="#1e293b" />
    <rect x="334" y="112" width="10" height="10" fill="#1e293b" />
    <rect x="350" y="112" width="10" height="10" fill="#1e293b" />
    <rect x="366" y="112" width="10" height="10" fill="#1e293b" />
    <rect x="322" y="128" width="46" height="12" fill="#1e293b" />

    <circle cx="346" cy="127" r="26" fill="#2cd9ff" opacity="0.3" class="pulse" />
    <circle cx="346" cy="127" r="38" fill="none" stroke="#2cd9ff" stroke-width="3" opacity="0.28" class="pulse" />

    <line x1="382" y1="124" x2="480" y2="124" stroke="#00d1ff" stroke-width="4" />
    <line x1="382" y1="132" x2="480" y2="132" stroke="#ff6a6a" stroke-width="4" />
  </g>

  <g class="px">
    <rect x="518" y="92" width="124" height="92" fill="#2f4fbd" stroke="#0f245f" stroke-width="3" />
    <rect x="530" y="106" width="44" height="32" fill="#15307f" />
    <rect x="582" y="104" width="48" height="12" fill="#1f6ce0" />
    <rect x="582" y="122" width="48" height="10" fill="#1f6ce0" />

    <rect x="624" y="140" width="8" height="8" fill="#ff4040" class="blink-fast" />
    <rect x="612" y="140" width="8" height="8" fill="#7eff5f" class="blink-slow" />

    <rect x="510" y="88" width="8" height="100" fill="#d5d8e4" />
    <rect x="642" y="88" width="8" height="100" fill="#d5d8e4" />
  </g>

  <g class="px">
    <rect class="packet" x="164" y="121" width="6" height="6" fill="#7effff" />
    <rect class="packet" x="164" y="129" width="6" height="6" fill="#ffb0b0" />
    <rect class="packet" x="338" y="121" width="6" height="6" fill="#7effff" style="animation-delay:0.7s" />
    <rect class="packet" x="338" y="129" width="6" height="6" fill="#ffb0b0" style="animation-delay:0.7s" />
  </g>
</svg>
